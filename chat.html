<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тёплый чатик мам 💬</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #0b0510;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 16px 105px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 920px; width: 100%; display: flex; flex-direction: column; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 16px;
      border-radius: 50px;
      margin-bottom: 18px;
    }
    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-link {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 40px;
    }
    .nav-link.active { background: linear-gradient(135deg, #ff1e7a, #8b5cf6); color: #fff; }
    .wallet {
      background: rgba(255, 30, 122, 0.25);
      border: 1px solid rgba(255, 106, 166, 0.5);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 13.5px;
      color: #ffd1e3;
    }
    .chat-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 68vh;
      min-height: 440px;
    }
    .chat-head {
      background: linear-gradient(135deg, rgba(255, 30, 122, 0.35), rgba(139, 92, 246, 0.35));
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 80%; padding: 13px 17px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; }
    .msg.in { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-bottom-left-radius: 5px; }
    .msg.out { background: linear-gradient(135deg, #ff1e7a, #8b5cf6); align-self: flex-end; border-bottom-right-radius: 5px; }
    .author { font-size: 11.5px; font-weight: 800; display: block; margin-bottom: 4px; }
    .msg.out .author { color: rgba(255,255,255,0.85); text-align: right; }
    .stickers {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: rgba(11, 5, 16, 0.5);
    }
    .sticker-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 133, 184, 0.4);
      color: #ffd1e3;
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-row { display: flex; gap: 10px; padding: 14px 16px; background: rgba(11, 5, 16, 0.7); }
    .input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px 16px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    .input-row button {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      border: none;
      color: #fff;
      padding: 0 22px;
      border-radius: 16px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .music-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 720px;
      background: rgba(22, 11, 32, 0.96);
      border: 1px solid rgba(255, 106, 166, 0.45);
      border-radius: 50px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 999;
    }
    .music-btn {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      border: none;
      color: #fff;
      padding: 9px 15px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="nav-links">
        <a href="index.html" class="nav-link">✨ Открытка</a>
        <a href="videos.html" class="nav-link">🎬 Видео</a>
        <a href="chat.html" class="nav-link active">💬 Чатик мам</a>
        <a href="wheel.html" class="nav-link">🎡 Колесо</a>
        <a href="game.html" class="nav-link">🎮 Игра</a>
      </div>
      <div class="wallet">❤️ Сердечек: <span id="heartBalance">15</span></div>
    </div>

    <div class="chat-box">
      <div class="chat-head">
        <div>
          <h2 style="font-size: 18px; font-weight: 800;">💐 Клуб лучших мам (8 участников)</h2>
          <span id="typingStatus" style="font-size: 12px; color: #34d399;">● В сети: Елена, Анна, Ольга, Наталья, Ирина, Татьяна и Сын</span>
        </div>
        <button type="button" onclick="resetChat()" style="background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 12px; cursor: pointer;">Сброс</button>
      </div>

      <div class="messages" id="box"></div>

      <div class="stickers">
        <button type="button" class="sticker-btn" onclick="quick('Ой, привет девчонки! Спасибо большое за поздравления! 💐')">Привет, спасибо за поздравления! 💐</button>
        <button type="button" class="sticker-btn" onclick="quick('Всех мамочек с нашим прекрасным праздником! 🌸')">Всех с праздником! 🌸</button>
        <button type="button" class="sticker-btn" onclick="quick('Как приятно, сижу и улыбаюсь ❤️')">Сижу улыбаюсь ❤️</button>
        <button type="button" class="sticker-btn" onclick="quick('Приходите все на праздничный чай с тортиком! 🎂')">Приглашаю на тортик! 🎂</button>
      </div>

      <div class="input-row">
        <input type="text" id="inp" placeholder="Напишите сообщение в чат..." onkeypress="if(event.key==='Enter') send()">
        <button type="button" onclick="send()">Отправить</button>
      </div>
    </div>
  </div>

  <div class="music-bar">
    <div style="font-size: 13px; font-weight: 700; color: #ffd1e3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
      <span id="bgStatus">🎵 Люблю я маму</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button type="button" class="music-btn" id="bgBtn" onclick="toggleBgMusic()">▶ Играть</button>
      <button type="button" class="music-btn" onclick="nextBgTrack()">⏭ Далее</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    var box = document.getElementById('box');
    var inp = document.getElementById('inp');
    var typing = document.getElementById('typingStatus');

    var people = [
      { name: "Елена 🌷", color: "#ff85b8" },
      { name: "Анна 🌸", color: "#c084fc" },
      { name: "Ольга ✨", color: "#ffd166" },
      { name: "Наталья 💐", color: "#34d399" },
      { name: "Ирина 💖", color: "#60a5fa" },
      { name: "Татьяна 🦋", color: "#f472b6" },
      { name: "Сын ❤️", color: "#fb7185" }
    ];

    var startData = [
      { u: "Сын ❤️", c: "#fb7185", t: "Мам, с Днём матери! Вся наша дружная компания собралась здесь, чтобы поздравить тебя!", m: false },
      { u: "Елена 🌷", c: "#ff85b8", t: "Лариса, с праздником тебя, дорогая! Здоровья, море цветов и счастья! 💐", m: false },
      { u: "Анна 🌸", c: "#c084fc", t: "Присоединяюсь! Пусть каждый день приносит только радость и улыбки! ✨", m: false },
      { u: "Ольга ✨", c: "#ffd166", t: "Лариса, ты потрясающая мама и чудесный человек! С Днём матери! 💖", m: false }
    ];

    var data = JSON.parse(localStorage.getItem('larisa_chat_v5')) || startData;

    function render() {
      box.innerHTML = '';
      for (var i = 0; i < data.length; i++) {
        var d = document.createElement('div');
        d.className = 'msg ' + (data[i].m ? 'out' : 'in');
        var col = data[i].c || '#ff85b8';
        d.innerHTML = '<span class="author" style="color:' + (data[i].m ? '#ffe4e6' : col) + '">' + data[i].u + '</span>' + data[i].t;
        box.appendChild(d);
      }
      box.scrollTop = box.scrollHeight;
    }

    function getSmartReplies(text) {
      var low = text.toLowerCase();
      if (low.indexOf('спасиб') !== -1 || low.indexOf('благодар') !== -1) {
        return [
          "Пожалуйста, Лариса! Ты заслуживаешь самых тёплых слов! 💐",
          "Пожалуйста-пожалуйста! С праздником тебя ещё раз! ❤️",
          "На здоровье, дорогая! Пусть настроение будет супер! 🌸",
          "Пожалуйста! Мы тебя очень любим и ценим! ✨"
        ];
      }
      if (low.indexOf('привет') !== -1 || low.indexOf('здравств') !== -1) {
        return [
          "Привет, Ларисочка! С Днём матери тебя! 🌷",
          "Приветик! Как твоё праздничное настроение? 💖",
          "Здравствуй, дорогая! Ура, ты зашла в наш чат! 🎉"
        ];
      }
      if (low.indexOf('чай') !== -1 || low.indexOf('торт') !== -1 || low.indexOf('гост') !== -1) {
        return [
          "Ой, с удовольствием! С меня вкусные конфеты к чаю! 🍬",
          "Уже бежим с букетом цветов и отличным настроением! 💐",
          "Какая замечательная идея! Праздник должен быть сладким! 🍰"
        ];
      }
      return [
        "Лариса, ты самая лучшая мама на свете! Сияй и улыбайся! 💖",
        "Полностью согласна! Пусть все твои мечты сбываются! ✨",
        "Как же здорово, что мы все здесь собрались! С праздником! 🌷",
"Мам, ты у нас просто супер! Люблю тебя! ❤️"
];
}
function send() {
var v = inp.value.trim();
if (!v) return;
data.push({ u: "Лариса (Вы)", t: v, m: true });
inp.value = '';
updateHearts(1);
save();
var pool = getSmartReplies(v);
var shuffled = people.slice().sort(function() { return 0.5 - Math.random(); });
var countReplies = 2 + Math.floor(Math.random() * 2); // 2 или 3 разных человека ответят подряд
for (var k = 0; k < countReplies; k++) {
(function(idx) {
var person = shuffled[idx];
var answer = pool[idx % pool.length];
setTimeout(function() {
typing.innerText = "✍️ " + person.name + " печатает...";
}, idx * 1100 + 300);
setTimeout(function() {
data.push({ u: person.name, c: person.color, t: answer, m: false });
typing.innerText = "● В сети: Елена, Анна, Ольга, Наталья, Ирина, Татьяна и Сын";
save();
}, (idx + 1) * 1200);
})(k);
}
}
function quick(t) { inp.value = t; send(); }
function save() { localStorage.setItem('larisa_chat_v5', JSON.stringify(data)); render(); }
function resetChat() { data = startData.slice(); save(); }
render();

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тёплый чатик мам 💬</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #0b0510;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 16px 30px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 880px; width: 100%; display: flex; flex-direction: column; }

    .navbar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px;
      border-radius: 50px;
      margin-bottom: 20px;
    }
    .nav-link {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 700;
      font-size: 13.5px;
      padding: 11px 18px;
      border-radius: 40px;
    }
    .nav-link.active {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      color: #fff;
    }

    .chat-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 75vh;
      min-height: 480px;
    }

    .chat-head {
      background: linear-gradient(135deg, rgba(255, 30, 122, 0.35), rgba(139, 92, 246, 0.35));
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 78%;
      padding: 13px 17px;
      border-radius: 20px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .msg.in { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-bottom-left-radius: 5px; }
    .msg.out { background: linear-gradient(135deg, #ff1e7a, #8b5cf6); align-self: flex-end; border-bottom-right-radius: 5px; }
    .author { font-size: 11.5px; font-weight: 800; color: #ff85b8; display: block; margin-bottom: 4px; }
    .msg.out .author { color: rgba(255,255,255,0.85); text-align: right; }

    .stickers {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: rgba(11, 5, 16, 0.5);
    }
    .sticker-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 133, 184, 0.4);
      color: #ffd1e3;
      padding: 7px 14px;
      border-radius: 50px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(11, 5, 16, 0.7);
    }
    .input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px 16px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    .input-row button {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      border: none;
      color: #fff;
      padding: 0 22px;
      border-radius: 16px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <a href="index.html" class="nav-link">✨ Открытка</a>
      <a href="music.html" class="nav-link">🎵 Песни</a>
      <a href="chat.html" class="nav-link active">💬 Чатик мам</a>
      <a href="game.html" class="nav-link">🎮 Игра для мамы</a>
    </nav>

    <div class="chat-box">
      <div class="chat-head">
        <div>
          <h2 style="font-size: 18px; font-weight: 800;">💐 Клуб лучших мам</h2>
          <span style="font-size: 12px; color: rgba(255,255,255,0.75);">● В сети: Лариса, Елена, Анна и Сын</span>
        </div>
        <button type="button" onclick="resetChat()" style="background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 12px; cursor: pointer;">Сброс</button>
      </div>

      <div class="messages" id="box"></div>

      <div class="stickers">
        <button type="button" class="sticker-btn" onclick="quick('💐 Огромный букет тюльпанов!')">💐 Букет</button>
        <button type="button" class="sticker-btn" onclick="quick('Спасибо огромное, девочки! ❤️')">Спасибо! ❤️</button>
        <button type="button" class="sticker-btn" onclick="quick('Всех мамочек с праздником! 🌸')">С праздником! 🌸</button>
        <button type="button" class="sticker-btn" onclick="quick('🎂 Праздничный тортик к чаю!')">🎂 Тортик</button>
      </div>

      <div class="input-row">
        <input type="text" id="inp" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') send()">
        <button type="button" onclick="send()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    var box = document.getElementById('box');
    var inp = document.getElementById('inp');
    var startData = [
      { u: "Сын ❤️", t: "Мам, с Днём матери! Добро пожаловать в твой праздничный чат!", m: false },
      { u: "Елена", t: "Лариса, с праздником! Здоровья, цветов и счастья каждый день! 🌷", m: false },
      { u: "Анна", t: "Ты потрясающая мама! Пусть улыбка никогда не сходит с лица! ✨", m: false }
    ];
    var replies = [
      { u: "Сын ❤️", t: "Ты самая лучшая мама на свете, Лариса! Люблю тебя! 💖" },
      { u: "Елена", t: "Какой шикарный сайт тебе сделали! Настоящий праздник 💐" },
      { u: "Анна", t: "Обязательно сегодня отдохни и выпей вкусного чаю с тортиком! 🍰" }
    ];

    var data = JSON.parse(localStorage.getItem('larisa_chat_v3')) || startData;

    function render() {
      box.innerHTML = '';
      for (var i = 0; i < data.length; i++) {
        var d = document.createElement('div');
        d.className = 'msg ' + (data[i].m ? 'out' : 'in');
        d.innerHTML = '<span class="author">' + data[i].u + '</span>' + data[i].t;
        box.appendChild(d);
      }
      box.scrollTop = box.scrollHeight;
    }

    function send() {
      var v = inp.value.trim();
      if (!v) return;
      data.push({ u: "Лариса (Вы)", t: v, m: true });
      inp.value = '';
      save();
      setTimeout(function() {
        var r = replies[Math.floor(Math.random() * replies.length)];
        data.push({ u: r.u, t: r.t, m: false });
        save();
      }, 850);
    }

    function quick(t) { inp.value = t; send(); }
    function save() { localStorage.setItem('larisa_chat_v3', JSON.stringify(data)); render(); }
    function resetChat() { data = startData.slice(); save(); }
    render();
  </script>
</body>
</html>

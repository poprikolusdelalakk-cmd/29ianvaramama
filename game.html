var pts = 0;
var sec = 30;
var best = Number(localStorage.getItem('mom_game_best2')) || 0;
document.getElementById('best').innerText = best;
var spawner = null;
var countdown = null;
var gameIcons = ['🌷', '🌹', '💐', '💖', '🌸', '👑'];
function startGame() {
pts = 0;
sec = 30;
document.getElementById('pts').innerText = pts;
document.getElementById('timeLeft').innerText = sec;
var field = document.getElementById('field');
field.innerHTML = '';
if (spawner) clearInterval(spawner);
if (countdown) clearInterval(countdown);
countdown = setInterval(function() {
sec--;
document.getElementById('timeLeft').innerText = sec;
if (sec <= 0) {
clearInterval(spawner);
clearInterval(countdown);
field.innerHTML = '🎉 Время вышло! Собрано: ' + pts + ' ❤️';
spawnParticles(18);
}
}, 1000);
spawner = setInterval(function() {
var el = document.createElement('div');
el.className = 'item';
var pick = gameIcons[Math.floor(Math.random() * gameIcons.length)];
el.innerText = pick;
el.style.left = (8 + Math.random() * 82) + '%';
el.style.top = '-45px';
field.appendChild(el);
var topPos = -45;
var speed = pick === '👑' ? 6 : 4;
var fall = setInterval(function() {
topPos += speed;
el.style.top = topPos + 'px';
if (topPos > 420 || sec <= 0) {
clearInterval(fall);
el.remove();
}
}, 25);
el.onclick = function() {
var bonus = pick === '👑' ? 5 : 1;
pts += bonus;
updateHearts(bonus);
document.getElementById('pts').innerText = pts;
if (pts > best) {
best = pts;
localStorage.setItem('mom_game_best2', best);
document.getElementById('best').innerText = best;
}
clearInterval(fall);
el.remove();
};
}, 550);
}

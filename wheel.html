<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо призов для мамы 🎡</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #0b0510;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 16px 110px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 900px; width: 100%; text-align: center; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 16px;
      border-radius: 50px;
      margin-bottom: 24px;
    }
    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-link {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 700;
      font-size: 13px;
      padding: 10px 15px;
      border-radius: 40px;
    }
    .nav-link.active { background: linear-gradient(135deg, #ff1e7a, #8b5cf6); color: #fff; }
    .wallet {
      background: rgba(255, 30, 122, 0.25);
      border: 1px solid rgba(255, 106, 166, 0.5);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 13.5px;
      color: #ffd1e3;
    }
    .box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 32px;
      padding: 34px 24px;
    }
    .wheel-wrap {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 24px auto;
    }
    .pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 10;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #ff6aa6;
      background: conic-gradient(
        #ff1e7a 0deg 60deg,
        #8b5cf6 60deg 120deg,
        #ec4899 120deg 180deg,
        #6366f1 180deg 240deg,
        #f43f5e 240deg 300deg,
        #a855f7 300deg 360deg
      );
      transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.25, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(255, 30, 122, 0.45);
    }
    .wheel-center {
      width: 74px;
      height: 74px;
      background: #0b0510;
      border: 3px solid #ffd166;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .btn-spin {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      color: #fff;
      border: none;
      padding: 16px 34px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 20px;
      cursor: pointer;
    }
    .result-box {
      margin-top: 22px;
      background: rgba(11, 5, 16, 0.75);
      border: 1px solid rgba(255, 209, 102, 0.5);
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      font-weight: 800;
      color: #ffd166;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 660px;
      background: rgba(22, 11, 32, 0.95);
      border: 1px solid rgba(255, 106, 166, 0.45);
      border-radius: 50px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 999;
    }
    .music-btn {
      background: linear-gradient(135deg, #ff1e7a, #8b5cf6);
      border: none;
      color: #fff;
      padding: 9px 16px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }
    .particle {
      position: fixed;
      bottom: -40px;
      font-size: 30px;
      pointer-events: none;
      z-index: 9999;
      animation: flyUp 2.8s ease-out forwards;
    }
    @keyframes flyUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-95vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="nav-links">
        <a href="index.html" class="nav-link">✨ Открытка</a>
        <a href="wheel.html" class="nav-link active">🎡 Колесо призов</a>
        <a href="chat.html" class="nav-link">💬 Чатик мам</a>
        <a href="game.html" class="nav-link">🎮 Игра</a>
      </div>
      <div class="wallet">❤️ Сердечек: <span id="heartBalance">10</span></div>
    </div>

    <div class="box">
      <h1 style="font-size: 28px; font-weight: 900;">🎡 Колесо сюрпризов для мамы</h1>
      <p style="color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 6px;">Крути колесо и забирай заслуженный подарок!</p>

      <div class="wheel-wrap">
        <div class="pointer">🔻</div>
        <div class="wheel" id="wheelEl">
          <div class="wheel-center">💐</div>
        </div>
      </div>

      <button type="button" class="btn-spin" onclick="spinWheel()">✨ Крутить колесо</button>

      <div class="result-box" id="prizeBox">Нажми на кнопку, чтобы узнать свой приз!</div>
    </div>
  </div>

  <div class="music-bar">
    <div style="font-size: 13px; font-weight: 700; color: #ffd1e3;">
      🎶 <span id="bgStatus">Нежность маминых рук</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button type="button" class="music-btn" id="bgBtn" onclick="toggleBgMusic()">▶ Включить</button>
      <button type="button" class="music-btn" onclick="nextBgTrack()">⏭ Трек</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    var currentDeg = 0;
    var prizes = [
      "☕ Вкусный кофе и завтрак прямо в постель!",
      "💆‍♀️ 15 минут расслабляющего массажа плеч!",
      "🧹 Полное освобождение от мытья посуды сегодня!",
      "🍰 Вкусный десерт или любимая шоколадка!",
      "🎬 Вечер семейного кино по твоему выбору!",
      "🤗 100 крепких объятий и поцелуев!"
    ];

    function spinWheel() {
      var extra = 1440 + Math.floor(Math.random() * 360);
      currentDeg += extra;
      document.getElementById('wheelEl').style.transform = 'rotate(' + currentDeg + 'deg)';
      document.getElementById('prizeBox').innerText = 'Крутим барабан... 🎲';

      setTimeout(function() {
        var win = prizes[Math.floor(Math.random() * prizes.length)];
        document.getElementById('prizeBox').innerText = '🎉 Твой приз: ' + win;
        updateHearts(5);
        spawnParticles(16);
      }, 3550);
    }
  </script>
</body>
</html>
